<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uni Semester Tracker — Sem 2 2026</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#fff;--bg2:#f5f4f0;
  --border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);
  --text:#1a1a18;--text2:#6b6a65;--text3:#9b9a95;
  --green:#1D9E75;--red:#E24B4A;--amber:#BA7517;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1a1a18;--bg2:#242422;
  --border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.18);
  --text:#e8e6df;--text2:#9b9a95;--text3:#6b6a65;
}}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px 24px 60px;display:flex;justify-content:center;}
.container{width:100%;max-width:1400px;}
h1{font-size:22px;font-weight:600;margin-bottom:3px;}
.subtitle{font-size:12.5px;color:var(--text3);margin-bottom:20px;}
.top-bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.fbtn{font-size:12px;padding:4px 12px;border-radius:20px;border:0.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:background .15s;font-family:inherit;}
.fbtn:hover,.fbtn.active{background:var(--bg2);color:var(--text);}
.fbtn.red{color:var(--red);}
.ebtn{font-size:12px;padding:4px 12px;border-radius:20px;border:0.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;}
.ebtn.on{background:#FAEEDA;color:#633806;border-color:#EF9F27;}
@media(prefers-color-scheme:dark){.ebtn.on{background:#412402;color:#FAC775;}}
.spacer{flex:1;}
.save-ind{font-size:11px;color:var(--text3);opacity:0;transition:opacity .4s;margin-right:5px;}
.save-ind.err{color:var(--red);}
.prog-wrap{display:flex;align-items:center;gap:8px;}
.prog-track{width:90px;height:4px;background:var(--border);border-radius:2px;}
.prog-fill{height:4px;background:var(--green);border-radius:2px;transition:width .3s;}
.prog-txt{font-size:11.5px;color:var(--text3);white-space:nowrap;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;}
@media(max-width:800px){.two-col{grid-template-columns:1fr;}.right-col{order:-1;}}
.right-col{display:flex;flex-direction:column;gap:16px;}
.panel{border:0.5px solid var(--border);border-radius:14px;padding:20px;background:var(--bg);}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.panel-head h3{font-size:13px;font-weight:600;color:var(--text2);margin:0;}
.panel-btn{font-size:11.5px;padding:2px 10px;border-radius:20px;border:0.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;}
.panel-btn:hover{background:var(--bg2);}
.break-div{text-align:center;font-size:11px;font-style:italic;color:var(--text3);padding:9px 0;border-top:0.5px dashed var(--border);border-bottom:0.5px dashed var(--border);margin:7px 0;}
.week-card{border:0.5px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--bg);transition:opacity .25s;}
.week-card.hidden{display:none;}
.week-card.behind{border-left:3px solid var(--red);}
.week-card.current{border-left:3px solid var(--green);}
.week-card.exam-card{border-left:3px solid var(--amber);}
.week-card.all-done{opacity:.42;}
.card-head{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;user-select:none;transition:background .15s;}
.card-head:hover{background:var(--bg2);}
.wk-num{font-size:14px;font-weight:600;}
.wk-dates{font-size:12px;color:var(--text3);}
.wk-badge{font-size:10.5px;padding:2px 9px;border-radius:9px;font-weight:500;}
.badge-cur{background:#EAF3DE;color:#27500A;}
.badge-beh{background:#FCEBEB;color:#A32D2D;}
@media(prefers-color-scheme:dark){.badge-cur{background:#173404;color:#C0DD97;}.badge-beh{background:#501313;color:#F09595;}}
.card-prog{font-size:11.5px;color:var(--text3);margin-left:auto;}
.chev{width:13px;height:13px;display:flex;align-items:center;justify-content:center;transition:transform .2s;flex-shrink:0;}
.chev svg{width:11px;height:11px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.week-card.collapsed .chev{transform:rotate(-90deg);}
.week-card.collapsed .card-body{display:none;}
.subj-row{display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:0.5px solid var(--border);}
.sdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.dot-Manufacturing{background:#1D9E75;}.dot-Comms{background:#7BC67E;}.dot-MachineDesign{background:#378ADD;}.dot-MaterialsHandling{background:#D85A30;}
.subj-name{font-size:12.5px;font-weight:600;width:110px;flex-shrink:0;}
.pills{display:flex;flex-wrap:wrap;gap:5px;flex:1;align-items:center;}
.pill{font-size:12px;padding:3px 11px;border-radius:20px;cursor:pointer;transition:opacity .15s;user-select:none;display:flex;align-items:center;gap:4px;font-family:inherit;}
.pill.done{opacity:.25;text-decoration:line-through;}
.pill::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;flex-shrink:0;}
.pill.done::before{background:currentColor;}
.p-lec{background:#E6F1FB;color:#0C447C;}.p-tut{background:#E1F5EE;color:#085041;}
.p-lab{background:#FAEEDA;color:#633806;}.p-wksh{background:#EEEDFE;color:#3C3489;}
.p-asgn{background:#FAECE7;color:#712B13;}.p-exam{background:#FAEEDA;color:#633806;}
@media(prefers-color-scheme:dark){
  .p-lec{background:#0C447C;color:#B5D4F4;}.p-tut{background:#085041;color:#9FE1CB;}
  .p-lab{background:#633806;color:#FAC775;}.p-wksh{background:#3C3489;color:#CECBF6;}
  .p-asgn{background:#712B13;color:#F5C4B3;}.p-exam{background:#633806;color:#FAC775;}
}
.due{font-size:10.5px;color:var(--red);font-weight:500;margin-left:1px;}
.del-pill{display:none;margin-left:2px;font-size:11px;opacity:.55;cursor:pointer;}
.edit-mode .del-pill{display:inline;}
.pill:hover .del-pill{opacity:1;}
.add-row{display:none;padding:7px 16px 9px;border-top:0.5px solid var(--border);gap:6px;flex-wrap:wrap;align-items:center;}
.edit-mode .add-row{display:flex;}
.add-row select,.add-row input,.add-dl-form select,.add-dl-form input{font-size:12px;padding:3px 9px;border-radius:8px;border:0.5px solid var(--border2);background:var(--bg);color:var(--text);height:28px;font-family:inherit;}
.add-row input[type="text"],.add-dl-form input[type="text"]{width:130px;}
.add-row input[type="date"],.add-dl-form input[type="date"]{width:140px;}
.add-row button,.add-dl-form button{font-size:12px;padding:3px 11px;border-radius:8px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text);cursor:pointer;font-family:inherit;}
.add-lbl{font-size:12px;color:var(--text3);}
.week-cb{width:17px;height:17px;border-radius:4px;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,border-color .15s;}
.week-cb.ticked{background:var(--green);border-color:var(--green);}
.week-cb.ticked::after{content:'';display:block;width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px);}
.dl-cb{width:15px;height:15px;border-radius:3px;border:1.5px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,border-color .15s;}
.dl-cb.ticked{background:var(--green);border-color:var(--green);}
.dl-cb.ticked svg{display:block;}
.dl-cb svg{display:none;width:9px;height:6px;}
.asgn-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.asgn-label{font-size:12.5px;color:var(--text);flex:1;cursor:text;}
.asgn-dates{font-size:11px;color:var(--text3);white-space:nowrap;margin-right:2px;cursor:text;}
.asgn-badge{font-size:11px;padding:2px 8px;border-radius:9px;font-weight:500;white-space:nowrap;cursor:pointer;}
.dl-urgent{background:#FCEBEB;color:#A32D2D;}.dl-soon{background:#FAEEDA;color:#633806;}
.dl-ok{background:#EAF3DE;color:#27500A;}.dl-tbc{background:var(--bg2);color:var(--text3);}
@media(prefers-color-scheme:dark){
  .dl-urgent{background:#501313;color:#F09595;}.dl-soon{background:#412402;color:#FAC775;}.dl-ok{background:#173404;color:#C0DD97;}
}
.del-asgn{font-size:11px;color:var(--text3);cursor:pointer;opacity:.5;padding:0 2px;flex-shrink:0;display:none;}
.del-asgn:hover{opacity:1;color:var(--red);}
.edit-mode .del-asgn{display:inline;}
.sub-toggle{font-size:11px;color:var(--text3);cursor:pointer;padding:2px 5px;border-radius:4px;user-select:none;flex-shrink:0;white-space:nowrap;}
.sub-toggle:hover{background:var(--bg2);}
.sub-wrap{padding:4px 0 8px 34px;display:flex;flex-direction:column;gap:4px;}
.sub-row{display:flex;align-items:center;gap:8px;}
.sub-cb{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--border2);flex-shrink:0;cursor:pointer;transition:background .15s,border-color .15s;display:flex;align-items:center;justify-content:center;}
.sub-cb.done{background:var(--green);border-color:var(--green);}
.sub-cb.done::after{content:'';display:block;width:7px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px);}
.sub-label{font-size:12px;color:var(--text2);flex:1;cursor:text;}
.sub-label.done{text-decoration:line-through;opacity:.38;}
.sub-prog{font-size:10.5px;color:var(--text3);flex-shrink:0;}
.add-sub-row{display:flex;align-items:center;gap:6px;margin-top:2px;}
.add-sub-row input{font-size:12px;padding:2px 8px;border-radius:7px;border:0.5px solid var(--border2);background:var(--bg);color:var(--text);height:26px;font-family:inherit;flex:1;}
.add-sub-row button{font-size:11.5px;padding:2px 9px;border-radius:7px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text);cursor:pointer;font-family:inherit;white-space:nowrap;}
.add-dl-form{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:10px 0 2px;border-top:0.5px solid var(--border);margin-top:8px;}
.add-dl-form label{font-size:11px;color:var(--text3);}
.date-pair{display:flex;align-items:center;gap:5px;}
.grp-hdr{display:flex;align-items:center;gap:7px;padding:10px 0 5px;border-bottom:0.5px solid var(--border);}
.grp-hdr span{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;}
.gantt-month-row{position:relative;height:18px;margin-bottom:7px;}
.gantt-month-lbl{position:absolute;font-size:11px;color:var(--text3);transform:translateX(-50%);}
.gantt-rows-wrap{position:relative;}
.gantt-grid-line{position:absolute;top:0;bottom:0;width:0.5px;background:var(--border);z-index:1;pointer-events:none;}
.gantt-row{display:flex;align-items:flex-start;margin-bottom:7px;gap:8px;position:relative;z-index:2;}
.gantt-lbl{font-size:11.5px;color:var(--text2);width:64px;flex-shrink:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-top:3px;}
.gantt-track{flex:1;border-radius:5px;background:var(--bg2);position:relative;min-height:24px;}
.gantt-bar{position:absolute;top:3px;height:18px;border-radius:4px;font-size:10.5px;font-weight:500;display:flex;align-items:center;padding:0 7px;overflow:hidden;white-space:nowrap;min-width:4px;z-index:2;cursor:default;}
.gantt-tooltip{position:fixed;background:var(--text);color:var(--bg);font-size:11px;padding:4px 9px;border-radius:7px;pointer-events:none;z-index:999;white-space:nowrap;opacity:0;transition:opacity .15s;}
.gantt-today-line{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--red);opacity:.6;z-index:5;}
.gantt-today-row{position:relative;height:16px;margin-top:5px;}
.gantt-today-lbl{position:absolute;font-size:10px;color:var(--red);font-weight:600;transform:translateX(-50%);white-space:nowrap;}
.g-cad1{background:#B5D4F4;color:#0C447C;}.g-cad2{background:#378ADD;color:#fff;}
.g-vib1{background:#9FE1CB;color:#085041;}
.g-hea1{background:#F5C4B3;color:#712B13;}
.g-gen1{background:#D3D1C7;color:#444441;}.g-gen2{background:#FAEEDA;color:#633806;}
@media(prefers-color-scheme:dark){
  .g-cad1{background:#0C447C;color:#B5D4F4;}.g-cad2{background:#185FA5;color:#E6F1FB;}
  .g-vib1{background:#085041;color:#9FE1CB;}
  .g-hea1{background:#712B13;color:#F5C4B3;}
  .g-gen1{background:#444441;color:#D3D1C7;}.g-gen2{background:#412402;color:#FAC775;}
}
.loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;font-size:13px;color:var(--text3);transition:opacity .3s;}
.loading-overlay.hidden{opacity:0;pointer-events:none;}
</style>
</head>
<body>
<div class="gantt-tooltip" id="gTooltip"></div>
<div class="container">
<div class="loading-overlay" id="loader">Loading your tracker...</div>
<h1>Uni semester tracker &mdash; Sem 2</h1>
<p class="subtitle">2026 &mdash; Manufacturing &middot; Comms &middot; Machine Design &middot; Materials Handling</p>
<div class="top-bar">
  <button class="fbtn active" onclick="filt('all',this)">All</button>
  <button class="fbtn red" onclick="filt('behind',this)">Behind</button>
  <button class="fbtn" onclick="filt('upcoming',this)">Upcoming</button>
  <button class="fbtn" onclick="filt('Manufacturing',this)">Manufacturing</button>
  <button class="fbtn" onclick="filt('Comms',this)">Comms</button>
  <button class="fbtn" onclick="filt('Machine Design',this)">Machine Design</button>
  <button class="fbtn" onclick="filt('Materials Handling',this)">Materials Handling</button>
  <div class="spacer"></div>
  <span class="save-ind" id="saveInd"></span>
  <button class="ebtn" id="collapseToggle" onclick="toggleCollapseAll()">Collapse all</button>
  <button class="ebtn" id="editToggle" onclick="toggleEdit()">Edit mode</button>
  <div class="prog-wrap">
    <div class="prog-track"><div class="prog-fill" id="prog" style="width:0%"></div></div>
    <span class="prog-txt" id="ptxt">0 / 0</span>
  </div>
</div>
<div class="two-col">
  <div id="cards"></div>
  <div class="right-col">
    <div class="panel">
      <h3 style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:14px;">Timeline</h3>
      <div id="gantt"></div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <h3>Assignments &amp; deadlines</h3>
        <button class="panel-btn" id="dlAddBtn" onclick="toggleAddDl()" style="display:none">+ Add</button>
      </div>
      <div id="dlRows"></div>
      <div class="add-dl-form" id="addDlForm" style="display:none">
        <select id="dlSubj">
          <option value="Manufacturing">Manufacturing</option>
          <option value="Comms">Comms</option>
          <option value="Machine Design">Machine Design</option>
          <option value="Materials Handling">Materials Handling</option>
        </select>
        <input type="text" id="dlLabel" placeholder="Task name"/>
        <div class="date-pair"><label>Start</label><input type="date" id="dlStart"/></div>
        <div class="date-pair"><label>Due</label><input type="date" id="dlEnd"/></div>
        <button onclick="addDlFromForm()">+ Add</button>
      </div>
    </div>
  </div>
</div>
</div>
<script>
var DB_BASE='https://uni-tracker-f035f-default-rtdb.asia-southeast1.firebasedatabase.app/5f3bbc683d2bfb14/';
var DB_URL=DB_BASE+'tasks.json';
var DB_DL_URL=DB_BASE+'deadlines.json';
var DB_ST_URL=DB_BASE+'subtasks.json';

var SUBJECTS=['Manufacturing','Comms','Machine Design','Materials Handling'];
var PILL_CLS={lec:'p-lec',tut:'p-tut',lab:'p-lab',wksh:'p-wksh',asgn:'p-asgn',exam:'p-exam'};
var SUBJ_BAR={Manufacturing:'g-vib1',Comms:'g-cad1','Machine Design':'g-cad2','Materials Handling':'g-hea1'};
var SUBJ_DOT={Manufacturing:'#1D9E75',Comms:'#7BC67E','Machine Design':'#378ADD','Materials Handling':'#D85A30'};
var SUBJ_ORDER=['Manufacturing','Comms','Machine Design','Materials Handling'];

var editMode=false,allCollapsed=false,completedOpen=false;
var pillMap={},cardPills={},idCounter=0;
var saveTimer=null,saveDebounce=null,dlDebounce=null;
var deletedKeys=new Set();
var userDeadlines=[],subtasksMap={};

var CHEV='<svg viewBox="0 0 11 11"><polyline points="2,3 5.5,7.5 9,3"/></svg>';
var TICK_SVG='<svg width="9" height="6" viewBox="0 0 9 6" fill="none"><polyline points="1,3 3.5,5.5 8,1" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var SEM_START=new Date(2026,6,20);
var B1_START=new Date(2026,7,17),B1_END=new Date(2026,7,24);
var B2_START=new Date(2026,8,28),B2_END=new Date(2026,9,5);
var EX_START=new Date(2026,10,2),EX_END=new Date(2026,10,13);
var GS=new Date(2026,6,20),GE=new Date(2026,10,20),GSPAN=GE-GS;
var B1_LEN=B1_END-B1_START,B2_LEN=B2_END-B2_START;

var MONTHS=[
  {lbl:'Jul',d:new Date(2026,6,1)},{lbl:'Aug',d:new Date(2026,7,1)},
  {lbl:'Sep',d:new Date(2026,8,1)},{lbl:'Oct',d:new Date(2026,9,1)},
  {lbl:'Nov',d:new Date(2026,10,1)},
];

var BASE_DEADLINES=[
  {id:'dl-md-test',   subj:'Machine Design',    label:'Class test (25%)',                        start:new Date(2026,8,9), end:new Date(2026,8,9), done:false,deleted:false},
  {id:'dl-mh-indiv',  subj:'Materials Handling', label:'Individual Project — Design of Silos (25%)',start:new Date(2026,6,20),end:new Date(2026,8,15),done:false,deleted:false},
  {id:'dl-md-asgn',   subj:'Machine Design',    label:'Assignment (35%)',                        start:null,               end:new Date(2026,9,4), done:false,deleted:false},
  {id:'dl-comms-cs',  subj:'Comms',             label:'Case Study (30%) — date TBC',             start:new Date(2026,6,20),end:new Date(2026,8,7), done:false,deleted:false},
  {id:'dl-mfg-report',subj:'Manufacturing',     label:'Group Project Report (40%)',              start:null,               end:new Date(2026,9,16),done:false,deleted:false},
  {id:'dl-mfg-poster',subj:'Manufacturing',     label:'Group Project Poster (10%)',              start:null,               end:new Date(2026,9,19),done:false,deleted:false},
  {id:'dl-mh-group',  subj:'Materials Handling', label:'Group Project — Belt Conveyor (35%)',    start:null,               end:new Date(2026,9,21),done:false,deleted:false},
  {id:'dl-comms-grp', subj:'Comms',             label:'Group Presentation & Report (30%) — date TBC',start:new Date(2026,8,14),end:new Date(2026,9,26),done:false,deleted:false},
  {id:'dl-comms-port',subj:'Comms',             label:'Portfolio (40%) — date TBC',              start:null,               end:null,               done:false,deleted:false},
  {id:'dl-mfg-exam',  subj:'Manufacturing',     label:'Final exam (40%)',                        start:EX_START,           end:EX_END,             done:false,deleted:false,showStart:true},
  {id:'dl-md-exam',   subj:'Machine Design',    label:'Final exam (40%)',                        start:EX_START,           end:EX_END,             done:false,deleted:false,showStart:true},
  {id:'dl-mh-exam',   subj:'Materials Handling', label:'Final exam (40%)',                       start:EX_START,           end:EX_END,             done:false,deleted:false,showStart:true},
];

var GANTT_SUBJ_LBL={'Manufacturing':'Manufactur.','Comms':'Comms','Machine Design':'Mach. Design','Materials Handling':'Mat. Handling'};
var GANTT_FIXED=[
  {lbl:'General',bars:[
    {cls:'g-gen1',s:B1_START,e:B1_END,txt:'Study Break'},
    {cls:'g-gen1',s:B2_START,e:B2_END,txt:'Study Break'},
    {cls:'g-gen2',s:EX_START,e:EX_END,txt:'Exams'},
  ]},
];
function getGanttRows(){
  var rows=[];
  var dlRows={};
  var allDls=BASE_DEADLINES.filter(function(d){return !d.deleted&&!d.done;})
    .concat(userDeadlines.filter(function(d){return !d.deleted&&!d.done;}));
  allDls.forEach(function(dl){
    if(!dl.start&&!dl.end)return;
    var s=dl.start||(new Date(dl.end-1209600000));
    var e=dl.end||(new Date(+dl.start+1209600000));
    var lbl=GANTT_SUBJ_LBL[dl.subj]||dl.subj;
    if(!dlRows[lbl])dlRows[lbl]=[];
    dlRows[lbl].push({cls:SUBJ_BAR[dl.subj]||'g-gen2',s:s,e:e,txt:dl.label,dlId:dl.id});
  });
  SUBJ_ORDER.forEach(function(subj){
    var lbl=GANTT_SUBJ_LBL[subj]||subj;
    if(dlRows[lbl])rows.push({lbl:lbl,bars:dlRows[lbl]});
  });
  GANTT_FIXED.forEach(function(r){rows.push(r);});
  return rows;
}

function pct(d){return Math.max(0,Math.min(100,(d-GS)/GSPAN*100));}
function fmtDate(d){return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];}
function daysUntil(d){var n=new Date();n.setHours(0,0,0,0);return Math.round((d-n)/864e5);}
function badgeCls(days){return days===null||days<0?'dl-tbc':days<=7?'dl-urgent':days<=21?'dl-soon':'dl-ok';}
function badgeTxt(days){return days===null?'TBC':days<0?'Past':days===0?'Today':days+'d';}
function dotCls(subj){return 'dot-'+subj.replace(/\s+/g,'');}

function getWeekStart(wk){
  // Calendar weeks are straight through - no offset needed
  return new Date(SEM_START.getTime()+(wk-1)*604800000);
}
function getWeekLabel(wk){
  var s=getWeekStart(wk);
  return fmtDate(s)+' \u2013 '+fmtDate(new Date(+s+518400000));
}
function getCurrentWeek(){
  var now=new Date();now.setHours(0,0,0,0);
  if(now<SEM_START)return 1;
  // Return calendar week number (1-15), -1 if in break
  var calWk=Math.floor((now-SEM_START)/604800000)+1;
  if(calWk===5||calWk===11||calWk===15)return -1; // tuition-free weeks
  return Math.min(15,Math.max(1,calWk));
}
var currentWeek=getCurrentWeek();

var MD_TUT_WKS=[1,3,6,8,10,12,14]; // Machine Design fortnightly (skipping breaks)
var MFG_TUT_WKS=[7,12];              // Manufacturing tutorial only these cal wks
function getTasks(wk,subj){
  var t=[];
  if(subj==='Manufacturing'){
    t.push({type:'lec',label:'Lecture'});
    if(wk>=2)t.push({type:'lab',label:'Lab'});
    if(MFG_TUT_WKS.indexOf(wk)>-1)t.push({type:'tut',label:'Tutorial'});
  }else if(subj==='Comms'){
    t.push({type:'wksh',label:'Seminar'});
    t.push({type:'tut',label:'Tutorial'});
  }else if(subj==='Machine Design'){
    t.push({type:'lec',label:'Lecture'});
    if(MD_TUT_WKS.indexOf(wk)>-1)t.push({type:'tut',label:'Tutorial'});
  }else if(subj==='Materials Handling'){
    t.push({type:'lec',label:'Lecture'});
    if(wk>=2)t.push({type:'tut',label:'Tutorial'});
  }
  return t;
}

function getAllDeadlines(){
  return BASE_DEADLINES.filter(function(d){return !d.deleted;})
    .concat(userDeadlines.filter(function(d){return !d.deleted;}))
    .sort(function(a,b){
      if(!a.end&&!b.end)return 0;
      if(!a.end)return 1;
      if(!b.end)return -1;
      return a.end-b.end;
    });
}

    list.forEach(function(s){

        inp.addEventListener('blur',save);
        inp.addEventListener('keydown',function(e){if(e.key==='Enter')inp.blur();if(e.key==='Escape')refreshSubs();});

function updateSubProg(dlId,mainRow){
  var list=subtasksMap[dlId]||[];
  var done=list.filter(function(s){return s.done;}).length;
  var pg=mainRow.querySelector('.sub-prog');
  if(list.length===0){if(pg)pg.remove();}
  else if(pg){pg.textContent=done+'/'+list.length;}
  else{var np=document.createElement('span');np.className='sub-prog';np.textContent=done+'/'+list.length;mainRow.querySelector('.asgn-label').after(np);}
}

function buildDeadlines(){
  var list=document.getElementById('dlRows');list.innerHTML='';
  var all=getAllDeadlines();
  var active=all.filter(function(d){return !d.done;});
  var done=all.filter(function(d){return d.done;});
  var grouped={};
  active.forEach(function(dl){if(!grouped[dl.subj])grouped[dl.subj]=[];grouped[dl.subj].push(dl);});
  SUBJ_ORDER.forEach(function(subj){
    if(!grouped[subj]||!grouped[subj].length)return;
    var hdr=document.createElement('div');hdr.className='grp-hdr';
    hdr.innerHTML='<div style="width:7px;height:7px;border-radius:50%;background:'+SUBJ_DOT[subj]+';flex-shrink:0"></div><span>'+subj+'</span>';
    list.appendChild(hdr);
    grouped[subj].forEach(function(dl){list.appendChild(makeDlRow(dl));});
  });
  if(done.length){
    var sep=document.createElement('div');
    sep.style.cssText='display:flex;align-items:center;gap:8px;padding:10px 0 4px;cursor:pointer;border-top:0.5px solid var(--border);margin-top:6px;';
    sep.innerHTML='<span style="font-size:11.5px;font-weight:600;color:var(--text3);">Completed ('+done.length+')</span><span id="compChev" style="font-size:10px;color:var(--text3);">'+(completedOpen?'\u25be':'\u25b8')+'</span>';
    sep.addEventListener('click',function(){
      completedOpen=!completedOpen;
      var cw=document.getElementById('completedRows');if(cw)cw.style.display=completedOpen?'block':'none';
      var ch=document.getElementById('compChev');if(ch)ch.textContent=completedOpen?'\u25be':'\u25b8';
    });
    list.appendChild(sep);
    var cWrap=document.createElement('div');cWrap.id='completedRows';cWrap.style.display=completedOpen?'block':'none';
    done.forEach(function(dl){var r=makeDlRow(dl);r.style.opacity='0.38';cWrap.appendChild(r);});
    list.appendChild(cWrap);
  }
}

function toggleDl(id){
  var dl=getAllDeadlines().find(function(d){return d.id===id;});

function delDl(id){

function loadDlState(state){

function buildGantt(){
  var g=document.getElementById('gantt');g.innerHTML='';
  var now=new Date();now.setHours(0,0,0,0);
  var tp=pct(now);
  var mRow=document.createElement('div');mRow.className='gantt-month-row';
  MONTHS.forEach(function(m){
    var lbl=document.createElement('div');lbl.className='gantt-month-lbl';
    lbl.style.left='calc(64px + 8px + (100% - 72px)*'+pct(m.d)/100+')';lbl.textContent=m.lbl;
    mRow.appendChild(lbl);
  });
  g.appendChild(mRow);
  var wrap=document.createElement('div');wrap.className='gantt-rows-wrap';
  MONTHS.forEach(function(m){
    var line=document.createElement('div');line.className='gantt-grid-line';
    line.style.left='calc(64px + 8px + (100% - 72px)*'+pct(m.d)/100+')';
    wrap.appendChild(line);
  });
  var rows=getGanttRows();
  rows.forEach(function(r){
    var row=document.createElement('div');row.className='gantt-row';
    var lbl=document.createElement('div');lbl.className='gantt-lbl';lbl.textContent=r.lbl;
    var track=document.createElement('div');track.className='gantt-track';
    var lanes=[];
    r.bars.forEach(function(b){
      var l=pct(b.s),w=pct(b.e)-l;
      var li=0;
      for(var i=0;i<lanes.length;i++){if(lanes[i]<=l){li=i;break;}if(i===lanes.length-1)li=lanes.length;}
      if(li>=lanes.length)lanes.push(0);
      lanes[li]=l+Math.max(0.5,w);
      var bar=document.createElement('div');bar.className='gantt-bar '+b.cls;
      bar.style.left=l+'%';bar.style.top=(3+li*22)+'px';
      if(w>8){
        bar.style.width=Math.max(0.5,w)+'%';bar.textContent=b.txt;
      }else{
        bar.style.width='16px';bar.style.height='16px';bar.style.borderRadius='50%';bar.style.padding='0';bar.style.top=(4+li*22)+'px';
        (function(txt){
          bar.addEventListener('mouseenter',function(e){var t=document.getElementById('gTooltip');if(t){t.textContent=txt;t.style.opacity='1';t.style.left=(e.clientX+12)+'px';t.style.top=(e.clientY-28)+'px';}});
          bar.addEventListener('mousemove',function(e){var t=document.getElementById('gTooltip');if(t){t.style.left=(e.clientX+12)+'px';t.style.top=(e.clientY-28)+'px';}});
          bar.addEventListener('mouseleave',function(){var t=document.getElementById('gTooltip');if(t)t.style.opacity='0';});
        })(b.txt);
      }
      track.appendChild(bar);
    });
    track.style.height=Math.max(24,lanes.length*22+6)+'px';
    var tl=document.createElement('div');tl.className='gantt-today-line';tl.style.left=tp+'%';track.appendChild(tl);
    row.appendChild(lbl);row.appendChild(track);wrap.appendChild(row);
  });
  g.appendChild(wrap);
  var tlRow=document.createElement('div');tlRow.className='gantt-today-row';
  var tlLbl=document.createElement('div');tlLbl.className='gantt-today-lbl';
  tlLbl.style.left='calc(64px + 8px + (100% - 72px)*'+tp/100+')';
  tlLbl.textContent='today \u2014 '+fmtDate(now);
  tlRow.appendChild(tlLbl);g.appendChild(tlRow);
}

function showInd(msg,isErr){

  clearTimeout(saveTimer);saveTimer=setTimeout(function(){el.style.opacity='0';},isErr?3000:1500);

function getState(){
  var s={tasks:{},deleted:{}};
  Object.keys(pillMap).forEach(function(id){if(pillMap[id].key)s.tasks[pillMap[id].key]=pillMap[id].done;});
  deletedKeys.forEach(function(k){s.deleted[k]=true;});
  return s;
}

function applyState(s){
  if(!s)return;
  var tasks=s.tasks||s,deleted=s.deleted||{};
  Object.keys(deleted).forEach(function(k){deletedKeys.add(k);});
  Object.keys(pillMap).forEach(function(id){
    var k=pillMap[id].key;if(!k)return;
    if(deleted[k]){
      var el=document.getElementById(id);if(el)el.remove();
      cardPills[pillMap[id].cardId]=(cardPills[pillMap[id].cardId]||[]).filter(function(p){return p!==id;});
      delete pillMap[id];
    }else if(tasks[k]!==undefined){
      pillMap[id].done=!!tasks[k];var el=document.getElementById(id);if(el)el.classList.toggle('done',!!tasks[k]);
    }
  });
  Object.keys(cardPills).forEach(updateCardProg);
  updateProgDisplay();
}

    .catch(function(){showInd('Offline \u2014 saved locally',true);});
  },600);
}

function buildCard(wk){
  var cardId='card-wk'+wk;
  var status=wk<currentWeek?'behind':wk===currentWeek?'current':'upcoming';
  cardPills[cardId]=[];
  var card=document.createElement('div');
  card.className='week-card '+status;
  card.id=cardId;card.setAttribute('data-status',status);card.setAttribute('data-wk',wk);
  var head=document.createElement('div');head.className='card-head';
  var wcb=document.createElement('div');wcb.className='week-cb';wcb.id='wcb-'+cardId;
  wcb.addEventListener('click',function(e){e.stopPropagation();tickWeek(cardId);});
  var hi=document.createElement('span');
  hi.style.cssText='display:flex;align-items:center;gap:9px;flex:1;min-width:0;';
  hi.innerHTML='<span class="wk-num">Week '+wk+'</span><span class="wk-dates">'+getWeekLabel(wk)+'</span><span class="card-prog" id="cprog-'+cardId+'"></span>';
  hi.addEventListener('click',function(){card.classList.toggle('collapsed');});
  var chev=document.createElement('div');chev.className='chev';chev.innerHTML=CHEV;
  chev.addEventListener('click',function(){card.classList.toggle('collapsed');});
  head.appendChild(wcb);head.appendChild(hi);head.appendChild(chev);card.appendChild(head);
  var body=document.createElement('div');body.className='card-body';
  SUBJECTS.forEach(function(subj){
    var key=wk+'-'+subj;
    var row=document.createElement('div');row.className='subj-row';row.setAttribute('data-subj',subj);
    row.innerHTML='<div class="sdot '+dotCls(subj)+'" style="flex-shrink:0"></div><span class="subj-name">'+subj+'</span>';
    var pDiv=document.createElement('div');pDiv.className='pills';pDiv.id='pills-'+key;
    getTasks(wk,subj).forEach(function(t){pDiv.appendChild(makePillEl(t,cardId,key+'-'+t.type+'-'+t.label.replace(/\s/g,'_')));});
    row.appendChild(pDiv);body.appendChild(row);
    var addRow=document.createElement('div');addRow.className='add-row';
    addRow.innerHTML='<span class="add-lbl">'+subj+':</span>'
      +'<select id="sel-type-'+key+'"><option value="lec">Lecture</option><option value="tut">Tutorial</option><option value="lab">Lab</option><option value="wksh">Workshop</option><option value="asgn">Assignment</option></select>'
      +'<input type="text" id="sel-label-'+key+'" placeholder="Task name"/>'
      +'<input type="date" id="sel-due-'+key+'"/>'
      +'<button onclick="addTask(\''+key+'\',\''+cardId+'\',\'pills-'+key+'\')">+ Add</button>';
    body.appendChild(addRow);
  });
  card.appendChild(body);updateCardProg(cardId);return card;
}

function buildExamCard(){
  var cardId='card-exam';cardPills[cardId]=[];
  var card=document.createElement('div');
  card.className='week-card exam-card collapsed';card.id=cardId;card.setAttribute('data-status','exam');
  var head=document.createElement('div');head.className='card-head';
  var wcb=document.createElement('div');wcb.className='week-cb';wcb.id='wcb-'+cardId;
  wcb.addEventListener('click',function(e){e.stopPropagation();tickWeek(cardId);});
  var hi=document.createElement('span');
  hi.style.cssText='display:flex;align-items:center;gap:9px;flex:1;';
  hi.innerHTML='<span class="wk-num">Exam period</span><span class="wk-dates">2 Nov \u2013 13 Nov</span><span class="card-prog" id="cprog-'+cardId+'"></span>';
  hi.addEventListener('click',function(){card.classList.toggle('collapsed');});
  var chev=document.createElement('div');chev.className='chev';chev.innerHTML=CHEV;
  chev.addEventListener('click',function(){card.classList.toggle('collapsed');});
  head.appendChild(wcb);head.appendChild(hi);head.appendChild(chev);card.appendChild(head);
  var body=document.createElement('div');body.className='card-body';
  var examDlMap={Manufacturing:'dl-mfg-exam',Comms:null,'Machine Design':'dl-md-exam','Materials Handling':'dl-mh-exam'};
  SUBJECTS.forEach(function(subj){
    var row=document.createElement('div');row.className='subj-row';row.setAttribute('data-subj',subj);
    row.innerHTML='<div class="sdot '+dotCls(subj)+'" style="flex-shrink:0"></div><span class="subj-name">'+subj+'</span>';
    var pDiv=document.createElement('div');pDiv.className='pills';pDiv.id='pills-exam-'+subj;
    var dlId=examDlMap[subj];
    var due='TBC';
    if(dlId){var dl=BASE_DEADLINES.find(function(d){return d.id===dlId;});if(dl&&dl.start){var d2=daysUntil(dl.start);due=d2+'d';}}
    pDiv.appendChild(makePillEl({type:'exam',label:'Final exam',due:due},cardId,'exam-'+subj+'-final'));
    row.appendChild(pDiv);body.appendChild(row);
    var addRow=document.createElement('div');addRow.className='add-row';
    addRow.innerHTML='<span class="add-lbl">'+subj+':</span>'
      +'<select id="sel-type-exam-'+subj+'"><option value="exam">Exam</option><option value="asgn">Assignment</option></select>'
      +'<input type="text" id="sel-label-exam-'+subj+'" placeholder="Task name"/>'
      +'<input type="date" id="sel-due-exam-'+subj+'"/>'
      +'<button onclick="addTask(\'exam-'+subj+'\',\''+cardId+'\',\'pills-exam-'+subj+'\')">+ Add</button>';
    body.appendChild(addRow);
  });
  card.appendChild(body);updateCardProg(cardId);return card;
}

var container=document.getElementById('cards');
for(var wk=1;wk<=15;wk++){
  if(wk===5){
    var d1=document.createElement('div');d1.className='break-div';d1.id='break-divider';
    d1.textContent='Wk 5 — Study break: 17 Aug – 23 Aug';container.appendChild(d1);
  } else if(wk===11){
    var d2=document.createElement('div');d2.className='break-div';d2.id='break-divider2';
    d2.textContent='Wk 11 — Study break: 28 Sep – 4 Oct';container.appendChild(d2);
  } else if(wk===15){
    var d3=document.createElement('div');d3.className='break-div';d3.id='break-divider3';
    d3.textContent='Wk 15 — Tuition-free: 26 Oct – 1 Nov';container.appendChild(d3);
  } else {
    container.appendChild(buildCard(wk));
  }
}
container.appendChild(buildExamCard());
updateProgDisplay();buildGantt();buildDeadlines();

Promise.all([
  fetch(DB_URL).then(function(r){return r.json();}).catch(function(){return null;}),
  fetch(DB_DL_URL).then(function(r){return r.json();}).catch(function(){return null;}),
  fetch(DB_ST_URL).then(function(r){return r.json();}).catch(function(){return null;})
]).then(function(res){
  var taskState=res[0],dlState=res[1],subState=res[2];
  if(!taskState)try{var r=localStorage.getItem('uni_tracker_v1');if(r)taskState=JSON.parse(r);}catch(e){}
  if(!dlState)try{var r=localStorage.getItem('uni_dl_v1');if(r)dlState=JSON.parse(r);}catch(e){}
  if(!subState)try{var r=localStorage.getItem('uni_subtasks_v1');if(r)subState=JSON.parse(r);}catch(e){}
  if(taskState&&Object.keys(taskState).length)applyState(taskState);
  if(dlState)loadDlState(dlState);
  if(subState)loadSubtasks(subState);
  buildDeadlines();buildGantt();
  var loader=document.getElementById('loader');loader.classList.add('hidden');
  setTimeout(function(){loader.style.display='none';},400);
});

function updateCardProg(cardId){
  var pids=cardPills[cardId]||[];
  var done=pids.filter(function(p){return pillMap[p]&&pillMap[p].done;}).length;
  var total=pids.length;
  var el=document.getElementById('cprog-'+cardId);if(el)el.textContent=done+' / '+total;
  var wcb=document.getElementById('wcb-'+cardId);if(wcb)wcb.classList.toggle('ticked',total>0&&done===total);
  var card=document.getElementById(cardId);if(!card)return;
  var wk=parseInt(card.getAttribute('data-wk'));
  var allDone=total>0&&done===total;
  var isUpcoming=card.getAttribute('data-status')==='upcoming';
  card.classList.toggle('collapsed',allDone||isUpcoming);
  card.classList.toggle('all-done',allDone);
  if(!isNaN(wk)){
    var isBehind=wk<currentWeek&&!allDone;
    card.classList.toggle('behind',isBehind);
    var hi=card.querySelector('.card-head span');
    if(hi){
      var ex=hi.querySelector('.wk-badge');if(ex)ex.remove();
      var prog=hi.querySelector('.card-prog');
      if(isBehind){var b=document.createElement('span');b.className='wk-badge badge-beh';b.textContent='behind';if(prog)hi.insertBefore(b,prog);}
      else if(wk===currentWeek&&!allDone){var b=document.createElement('span');b.className='wk-badge badge-cur';b.textContent='current';if(prog)hi.insertBefore(b,prog);}
    }
  }
}

function updateProgDisplay(){
  var keys=Object.keys(pillMap),total=keys.length;
  var done=keys.filter(function(id){return pillMap[id].done;}).length;
  document.getElementById('prog').style.width=(total?Math.round(done/total*100):0)+'%';
  document.getElementById('ptxt').textContent=done+' / '+total;
}

function tickPill(id){
  if(!pillMap[id])return;
  pillMap[id].done=!pillMap[id].done;
  document.getElementById(id).classList.toggle('done',pillMap[id].done);
  updateCardProg(pillMap[id].cardId);updateProgDisplay();dbSave();
}

function tickWeek(cardId){
  var pids=cardPills[cardId]||[];
  var allDone=pids.every(function(p){return pillMap[p]&&pillMap[p].done;});
  pids.forEach(function(pid){if(!pillMap[pid])return;pillMap[pid].done=!allDone;document.getElementById(pid).classList.toggle('done',!allDone);});
  updateCardProg(cardId);updateProgDisplay();dbSave();
}

function delPill(e,id){
  e.stopPropagation();if(!pillMap[id])return;
  var cardId=pillMap[id].cardId,key=pillMap[id].key;
  if(key)deletedKeys.add(key);
  document.getElementById(id).remove();
  cardPills[cardId]=(cardPills[cardId]||[]).filter(function(p){return p!==id;});
  delete pillMap[id];
  updateCardProg(cardId);updateProgDisplay();dbSave();
}

function addTask(key,cardId,divId){
  var typeEl=document.getElementById('sel-type-'+key);
  var labelEl=document.getElementById('sel-label-'+key);
  var dueEl=document.getElementById('sel-due-'+key);
  if(!typeEl||!labelEl||!labelEl.value.trim())return;
  var label=labelEl.value.trim();
  var due=dueEl&&dueEl.value?fmtDate(new Date(dueEl.value)):'';
  var div=document.getElementById(divId);
  if(div)div.appendChild(makePillEl({type:typeEl.value,label:label,due:due},cardId,key+'-'+typeEl.value+'-'+label.replace(/\s/g,'_')+'-'+Date.now()));
  labelEl.value='';if(dueEl)dueEl.value='';
  updateCardProg(cardId);updateProgDisplay();dbSave();
}

function toggleCollapseAll(){
  allCollapsed=!allCollapsed;
  document.getElementById('collapseToggle').textContent=allCollapsed?'Expand all':'Collapse all';
  document.querySelectorAll('.week-card').forEach(function(card){
    if(allCollapsed){card.classList.add('collapsed');}
    else{
      var pids=cardPills[card.id]||[];
      var done=pids.filter(function(p){return pillMap[p]&&pillMap[p].done;}).length;
      var isUpcoming=card.getAttribute('data-status')==='upcoming'||card.getAttribute('data-status')==='exam';
      card.classList.toggle('collapsed',pids.length>0&&done===pids.length||isUpcoming);
    }
  });
}

function toggleEdit(){
  editMode=!editMode;
  document.getElementById('editToggle').classList.toggle('on',editMode);
  document.getElementById('editToggle').textContent=editMode?'Done editing':'Edit mode';
  document.getElementById('cards').classList.toggle('edit-mode',editMode);
  document.getElementById('dlRows').classList.toggle('edit-mode',editMode);
  var btn=document.getElementById('dlAddBtn');if(btn)btn.style.display=editMode?'':'none';
  if(!editMode){var f=document.getElementById('addDlForm');if(f)f.style.display='none';}
}

function filt(val,btn){
  document.querySelectorAll('.fbtn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.querySelectorAll('.subj-row,.add-row').forEach(function(r){r.style.display='';});
  document.querySelectorAll('.week-card').forEach(function(card){
    var status=card.getAttribute('data-status');
    if(val==='all'){card.classList.remove('hidden');return;}
    if(val==='behind'){card.classList.toggle('hidden',status!=='behind');return;}
    if(val==='upcoming'){card.classList.toggle('hidden',status!=='upcoming'&&status!=='exam');return;}
    var has=false;
    card.querySelectorAll('.subj-row').forEach(function(r){var m=r.getAttribute('data-subj')===val;r.style.display=m?'':'none';if(m)has=true;});
    card.querySelectorAll('.add-row').forEach(function(r){r.style.display=r.innerHTML.indexOf(val)>-1?'':'none';});
    card.classList.toggle('hidden',!has);
  });
  var bd=document.getElementById('break-divider');if(bd)bd.style.display=(val==='all'||val==='behind'||val==='upcoming')?'':'none';
  var bd2=document.getElementById('break-divider2');if(bd2)bd2.style.display=(val==='all'||val==='behind'||val==='upcoming')?'':'none';
  var bd3=document.getElementById('break-divider3');if(bd3)bd3.style.display=(val==='all'||val==='behind'||val==='upcoming')?'':'none';
}

function registerSW(){if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(function(e){console.warn('SW reg failed:',e);});}

function sendNotif(title,body,tag){
  if(!('serviceWorker' in navigator)||!navigator.serviceWorker.controller)return;
  navigator.serviceWorker.controller.postMessage({type:'notify',title:title,body:body,tag:tag});
}

function checkDeadlineNotifications(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  getAllDeadlines().forEach(function(dl){
    if(dl.done||dl.deleted)return;
    var ref=dl.showStart?dl.start:dl.end;if(!ref)return;
    var days=daysUntil(ref);
    var title;
    if(days<=0)title='Due today!';
    else if(days<=1)title='Due tomorrow!';
    else if(days<=7)title='Due in '+days+' days';
    else return;
    sendNotif(title,dl.subj+' \u2014 '+dl.label+(ref?' ('+fmtDate(ref)+')':''),dl.id+'-'+Date.now());
  });
}

function requestNotifPermission(){
  if(!('Notification' in window))return;
  if(Notification.permission==='default')Notification.requestPermission().then(function(p){if(p==='granted')setTimeout(checkDeadlineNotifications,500);});
}

registerSW();
requestNotifPermission();
setTimeout(function(){if(Notification.permission==='granted')checkDeadlineNotifications();},3000);
</script>
